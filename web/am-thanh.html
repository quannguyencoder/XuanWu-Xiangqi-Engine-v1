<!doctype html><html lang="vi"><head><meta charset="utf-8">
<title>Chọn âm thanh — XuanWu</title>
<style>
 body{background:#16181d;color:#e8e6e3;font:15px/1.6 -apple-system,sans-serif;
      max-width:640px;margin:36px auto;padding:0 20px}
 h1{font-size:20px} .m{color:#8b909a;font-size:13.5px}
 .d{display:flex;align-items:center;gap:12px;background:#20242b;
    border:1px solid #2f343d;border-radius:9px;padding:12px;margin-bottom:9px}
 .n{font-weight:700;width:26px;color:#8b909a}
 .t{flex:1;font-size:13px;color:#8b909a;font-family:ui-monospace,Menlo,monospace}
 button{background:#2b3038;border:1px solid #2f343d;color:#e8e6e3;
        border-radius:7px;padding:8px 14px;cursor:pointer;font-size:14px}
 button:hover{background:#343a44}
 select{background:#2b3038;border:1px solid #2f343d;color:#e8e6e3;
        border-radius:7px;padding:7px;font-size:13.5px;min-width:150px}
 .luu{background:#c0392b;border-color:#c0392b;font-weight:600;
      padding:11px 20px;margin-top:14px}
 code{background:#20242b;padding:2px 6px;border-radius:4px;font-size:13px}
</style></head><body>
<h1>Chọn âm thanh</h1>
<p class="m">Nghe từng đoạn rồi gán vào sự kiện. Lựa chọn được lưu lại và
áp dụng ngay cho trang chơi cờ.</p>
<div id="ds"></div>
<button class="luu" onclick="luu()">Lưu lựa chọn</button>
<p class="m" id="tb"></p>
<script>
const SK=[['','— không dùng —'],['di','Đi quân'],['an','Ăn quân'],
          ['chieu','Chiếu tướng'],['win','Thắng'],['thua','Thua'],
          ['hoa','Hoà'],['batdau','Bắt đầu ván']];
const MO_TA={1:'0,35s · nốt cao',2:'0,25s · gõ trầm, to',3:'0,25s · chuông cao',
 4:'0,39s · nốt cao, to',5:'0,29s · nốt vừa',6:'2,89s · dài, to nhất',
 7:'3,33s · dài, nhỏ',8:'0,75s · gõ trầm',9:'1,13s · chuông vừa',
 10:'1,17s · gõ rất trầm, to'};
const cu=JSON.parse(localStorage.getItem('am_gan')||'{}');
const ds=document.getElementById('ds');
for(let i=1;i<=10;i++){
  const d=document.createElement('div'); d.className='d';
  d.innerHTML=`<span class="n">${i}</span>
    <button onclick="new Audio('am${i}.wav').play()">▶ Nghe</button>
    <span class="t">${MO_TA[i]}</span>
    <select id="s${i}">${SK.map(([v,t])=>
      `<option value="${v}"${cu[i]===v?' selected':''}>${t}</option>`).join('')}</select>`;
  ds.appendChild(d);
}
function luu(){
  const g={};
  for(let i=1;i<=10;i++){ const v=document.getElementById('s'+i).value; if(v) g[i]=v; }
  localStorage.setItem('am_gan',JSON.stringify(g));
  document.getElementById('tb').innerHTML='Đã lưu. Mở lại <code>/</code> để dùng.';
}
</script></body></html>
