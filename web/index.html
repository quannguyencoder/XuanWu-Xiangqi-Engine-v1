<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XuanWu 玄武 — Xiangqi</title>
<link rel="icon" href="mascot.png">
<style>
  :root{
    --go:#dfb87f; --luoi:#8b5e34; --do:#c0392b; --den:#1c1c1c;
    --nen:#16181d; --the:#20242b; --vien:#2f343d;
    --chu:#e8e6e3; --mo:#8b909a; --xanh:#4ade80;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--nen);color:var(--chu);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .khung{display:flex;gap:18px;padding:18px;align-items:flex-start;
         justify-content:center;flex-wrap:wrap;max-width:1500px;margin:0 auto}

  .thanh{width:24px;height:620px;background:#111;border-radius:4px;
         position:relative;overflow:hidden;flex-shrink:0;border:1px solid var(--vien)}
  .thanh-do{position:absolute;left:0;right:0;bottom:0;background:#f2ede4;
            transition:height .4s cubic-bezier(.4,0,.2,1)}
  .thanh-so{position:absolute;left:0;right:0;text-align:center;font-size:9px;
            font-weight:700;font-variant-numeric:tabular-nums}
  .thanh-tren{top:4px;color:#ccc} .thanh-duoi{bottom:4px;color:#111}
  .thanh-giua{position:absolute;left:0;right:0;top:50%;height:1px;background:#c0392b88}

  .ban{position:relative;background:var(--go);border-radius:5px;
       box-shadow:0 8px 30px #0007;flex-shrink:0}
  .ban svg{display:block}
  .lop-bam{position:absolute;inset:0;z-index:3;cursor:pointer}
  .quan{position:absolute;z-index:4;border-radius:50%;display:flex;
        align-items:center;justify-content:center;font-weight:700;cursor:pointer;
        user-select:none;transition:transform .15s,box-shadow .15s;
        background:radial-gradient(circle at 34% 30%,#fdf7ea,#e4d0a9 72%);
        box-shadow:0 2px 5px #0006}
  .quan:hover{transform:scale(1.06)}
  .quan.do{color:var(--do);border:2.5px solid var(--do);
           box-shadow:0 2px 6px #0007,inset 0 0 0 1.5px #fff8}
  .quan.den{color:var(--den);border:2.5px solid var(--den);
            box-shadow:0 2px 6px #0007,inset 0 0 0 1.5px #fff8}
  .quan.chon{box-shadow:0 0 0 3px #f1c40f,0 2px 8px #0008;transform:scale(1.06)}
  .quan.vua-di{box-shadow:0 0 0 3px #4a9eff,0 2px 8px #0008}
  .quan.se-bi-an{animation:rung .55s ease-in-out infinite}
  @keyframes rung{0%,100%{transform:scale(1.06) rotate(0)}
                  25%{transform:scale(1.06) rotate(-4deg)}
                  75%{transform:scale(1.06) rotate(4deg)}}
  .quan.bay{transition:left .26s cubic-bezier(.34,1.3,.5,1),
                       top .26s cubic-bezier(.34,1.3,.5,1);z-index:9}
  .cham{position:absolute;border-radius:50%;background:#2ecc7199;pointer-events:none}
  .cham.an{background:#e74c3c28;border:4px solid #e74c3c;box-sizing:border-box;
           animation:dap 1.1s ease-in-out infinite}
  @keyframes dap{0%,100%{transform:scale(1);opacity:.95}
                 50%{transform:scale(1.08);opacity:.6}}
  .mui-ten{position:absolute;inset:0;pointer-events:none;z-index:5}

  .ben{width:380px;display:flex;flex-direction:column;gap:12px}
  .the{background:var(--the);border:1px solid var(--vien);border-radius:10px;padding:15px}
  .dau{display:flex;align-items:center;gap:12px}
  .dau img{width:44px;height:44px;border-radius:9px}
  .dau h1{margin:0;font-size:17px;font-weight:650}
  .dau .p{color:var(--mo);font-size:12.5px}
  .nn{margin-left:auto;display:flex;gap:4px}
  .nn button{padding:5px 9px;font-size:11px;width:auto;margin:0;border-radius:6px}
  .nn button.on{background:var(--do);border-color:var(--do);color:#fff}

  .diem-to{font-size:44px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
  .diem-to small{font-size:15px;color:var(--mo);font-weight:400}
  .nhan{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;
        background:#3a3f49;color:var(--chu);margin-top:9px}

  h2{margin:0 0 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--mo);font-weight:600}
  .nuoc-to{font-size:23px;font-weight:700;color:var(--xanh);
           font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .pv{color:var(--mo);font-size:12.5px;line-height:1.9;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  .pv b{color:var(--chu)}
  .ky{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:13px}
  .ky span:nth-child(odd){color:var(--mo)}
  .ky span:nth-child(even){font-variant-numeric:tabular-nums}

  button,select,input{font-family:inherit;font-size:13.5px;background:#2b3038;
        border:1px solid var(--vien);color:var(--chu);border-radius:7px;padding:8px}
  button{cursor:pointer} button:hover{background:#343a44}
  button.chinh{background:var(--do);border-color:var(--do);font-weight:600}
  button.chinh:hover{background:#d0432f}
  .hang{display:flex;gap:7px;margin-bottom:8px}
  .hang>*{flex:1;min-width:0}
  .ds{font-size:13px;max-height:200px;overflow-y:auto;
      font-variant-numeric:tabular-nums;line-height:1.85}
  .ds div{display:flex;gap:10px}
  .ds span:first-child{color:var(--mo);width:26px;flex-shrink:0}
  .ds span:not(:first-child){width:88px}
  .fen{font-family:ui-monospace,Menlo,monospace;font-size:11px;width:100%}
  .chia{color:var(--mo);font-size:11.5px;margin-top:9px;
        font-family:ui-monospace,Menlo,monospace}

  /* Phan luat choi o duoi, trai het be ngang trang */
  .luat{max-width:1500px;margin:0 auto;padding:0 18px 40px}
  .luat h2{font-size:12px;margin:22px 0 12px}
  .bang-quan{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
             gap:10px}
  .dong-quan{display:flex;gap:13px;align-items:flex-start;background:var(--the);
             border:1px solid var(--vien);border-radius:9px;padding:12px 14px}
  .bieu{width:44px;height:44px;flex-shrink:0;border-radius:50%;display:flex;
        align-items:center;justify-content:center;font-size:23px;font-weight:700;
        background:radial-gradient(circle at 34% 30%,#fdf7ea,#e4d0a9 72%)}
  .bieu.d{color:var(--do);border:2.5px solid var(--do)}
  .bieu.n{color:var(--den);border:2.5px solid var(--den)}
  .mo-ta b{display:block;margin-bottom:2px;font-size:14px}
  .mo-ta span{color:var(--mo);font-size:13px;line-height:1.55;display:block}
  .mo-ta .kh{font-size:11.5px;margin-bottom:4px;color:#7a8090}
  .mo-ta code{background:#2b3038;padding:1px 6px;border-radius:4px;color:#dfe3ea;
              font-family:ui-monospace,Menlo,monospace}
  .ds-luat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
           gap:9px}
  .y{background:var(--the);border:1px solid var(--vien);border-radius:9px;
     padding:11px 14px;font-size:13.5px;color:var(--mo);line-height:1.6}
  .y b{color:#ffb4a8}
</style>
</head>
<body>
<div class="khung">
  <div class="thanh">
    <div class="thanh-do" id="thanhDo" style="height:50.5%"></div>
    <div class="thanh-giua"></div>
    <div class="thanh-so thanh-tren" id="soDen">495</div>
    <div class="thanh-so thanh-duoi" id="soDo">505</div>
  </div>

  <div class="ban" id="ban"></div>

  <div class="ben">
    <div class="the dau">
      <img src="mascot.png" alt="XuanWu">
      <div>
        <h1>XuanWu 玄武</h1>
        <div class="p"><span id="tTieuDe">Bàn phân tích</span> —
          <span id="tPhu">thang 0–1000 cho Đỏ</span></div>
      </div>
      <div class="nn">
        <button onclick="datNN('vi')" id="nnvi" class="on">VI</button>
        <button onclick="datNN('en')" id="nnen">EN</button>
        <button onclick="datNN('zh')" id="nnzh">中</button>
      </div>
    </div>

    <div class="the">
      <div class="diem-to"><span id="diemTo">505</span><small> / 1000</small></div>
      <div id="nhanDiem" class="nhan">Cân bằng</div>
      <div id="ttVan" style="margin-top:9px;font-size:13.5px"></div>
    </div>

    <div class="the">
      <h2><span id="tNuocTot">Nước tốt nhất cho</span> <b id="benTot">Đỏ</b></h2>
      <div class="nuoc-to" id="nuocTot">—</div>
      <div class="pv" id="pv"></div>
      <div style="margin-top:8px;font-size:12.5px;color:var(--mo)">
        <span id="tVuaDi">Nước vừa đi</span> <b id="vuaDiTxt">—</b>
        <span id="nhanSach" class="nhan" style="display:none;margin:0 0 0 6px">Theo sách</span>
        <span id="chamNuoc"></span>
      </div>
    </div>

    <div class="the">
      <div class="ky" id="bangKy"></div>
    </div>

    <div class="the">
      <div class="hang">
        <select id="cheDo" onchange="doiCheDo()"></select>
        <select id="mucDo" onchange="neuTuChoi()"></select>
      </div>
      <div class="hang">
        <select id="benCam" onchange="vanMoi()"></select>
      </div>
      <div class="hang">
        <button onclick="lui()" id="bLui">↰ Lùi</button>
        <button class="chinh" onclick="vanMoi()" id="bMoi">Ván mới</button>
        <button onclick="xoayBan()" id="bXoay">⇅ Xoay</button>
      </div>
      <div class="hang">
        <button onclick="xinGoiY()" id="bGoiY">💡 Gợi ý nước đi</button>
      </div>
      <div class="hang">
        <input class="fen" id="oFen" placeholder="FEN">
        <button onclick="napFen()" id="bFen" style="flex:0 0 90px">Nạp FEN</button>
      </div>
      <div class="chia" id="chiaSe"></div>
    </div>

    <div class="the">
      <h2 id="tBiAn">Quân bị ăn</h2>
      <div id="biAn" style="font-size:22px;line-height:1.5;min-height:34px">—</div>
    </div>

    <div class="the">
      <h2 id="tNuocDaDi">Nước đã đi</h2>
      <div class="ds" id="ds"></div>
    </div>
  </div>
</div>

<div class="luat">
  <h2 id="tCachDi">Cách đi quân</h2>
  <p style="color:var(--mo);font-size:13px;margin:-4px 0 12px" id="tGhiChu"></p>
  <div class="bang-quan" id="bangQuan"></div>
  <h2 id="tLuatDacBiet">Luật đặc biệt</h2>
  <div class="ds-luat" id="dsLuat"></div>
</div>

<script src="lang.js"></script>
<script>
const O=72, LE=44;   // o to hon + le rong cho so toa do
const TEN={R:['車','俥'],H:['馬','傌'],E:['象','相'],A:['士','仕'],
           K:['將','帥'],C:['砲','炮'],P:['卒','兵']};
let van=null, banCo=null, chon=null, hopLe=[], vuaDi=null, dangCho=false;
let benDi='trang', goiY=null, xoay=false, diemTruoc=505, phien=0, lichSu=[];
let quanBiAn=[];        // ['p','R',...] theo thu tu bi an
let banTruocNuoc=[];    // ban co truoc tung nuoc, de ghi ky hieu truyen thong
let nn='vi', T=NGON_NGU.vi;

const tuChoi=()=>document.getElementById('cheDo').value==='tu';
const raMH=(r,c)=>xoay?[9-r,8-c]:[r,c];
const tuMH=(r,c)=>xoay?[9-r,8-c]:[r,c];
const kyHieu=m=>m?`${'abcdefghi'[m[1]]}${9-m[0]}${'abcdefghi'[m[3]]}${9-m[2]}`:'—';

// --- Ghi nuoc di theo loi co tuong truyen thong ---
// Cot duoc danh so tu PHIA MINH nhin sang: Do dem tu phai sang trai, Den dem
// tu trai sang phai. Nen cung mot cot vat ly co hai so khac nhau tuy ben.
// Huong: tien (len phia doi phuong), thoai (lui ve), binh (di ngang).
// Quan di CHEO (Ma, Tuong, Si) luon ghi cot DICH; quan di thang ghi SO BUOC.
// KY HIEU dung khi GHI NUOC DI (ngan gon), TEN DAY dung khi GIAI THICH.
// Truoc day tron lam mot nen ban tieng Anh chi hien "R", "N" ma mat het ten.
const TEN_QUAN={          // ky hieu ghi nuoc, ben Den
  vi:{R:'Xe',H:'Mã',E:'Tượng',A:'Sĩ',K:'Tướng',C:'Pháo',P:'Tốt'},
  en:{R:'R',H:'N',E:'B',A:'A',K:'K',C:'C',P:'P'},
  zh:{R:'車',H:'馬',E:'象',A:'士',K:'將',C:'砲',P:'卒'},
};
const TEN_QUAN_DO={       // ky hieu ghi nuoc, ben Do
  vi:{R:'Xe',H:'Mã',E:'Tượng',A:'Sĩ',K:'Soái',C:'Pháo',P:'Binh'},
  en:{R:'R',H:'N',E:'B',A:'A',K:'K',C:'C',P:'P'},
  zh:{R:'俥',H:'傌',E:'相',A:'仕',K:'帥',C:'炮',P:'兵'},
};
const TEN_DAY={           // ten day du, dung o phan giai thich
  vi:{R:'Xe',H:'Mã',E:'Tượng',A:'Sĩ',K:'Tướng / Soái',C:'Pháo',P:'Tốt / Binh'},
  en:{R:'Chariot (Rook)',H:'Horse (Knight)',E:'Elephant (Bishop)',
      A:'Advisor (Guard)',K:'General (King)',C:'Cannon',P:'Soldier (Pawn)'},
  zh:{R:'車 / 俥',H:'馬 / 傌',E:'象 / 相',A:'士 / 仕',K:'將 / 帥',
      C:'砲 / 炮',P:'卒 / 兵'},
};
const HUONG={vi:{t:'tấn',th:'thoái',b:'bình'},
             en:{t:'+',th:'-',b:'='},
             zh:{t:'进',th:'退',b:'平'}};
const SO_ZH=['','一','二','三','四','五','六','七','八','九'];

function ghiNuoc(mv, banTruoc){
  if(!mv||!banTruoc) return kyHieu(mv);
  const [r0,c0,r1,c1]=mv;
  const p=banTruoc[r0][c0];
  if(!p||p==='.') return kyHieu(mv);
  const do_= p===p.toUpperCase();
  const loai=p.toUpperCase();
  const ten=(do_?TEN_QUAN_DO:TEN_QUAN)[nn][loai];
  // So cot theo goc nhin cua ben di
  const cot = x => do_ ? 9-x : x+1;
  const so = n => nn==='zh' ? SO_ZH[n] : n;
  const h = HUONG[nn];
  let dong;
  if(r0===r1){                                  // di ngang
    dong = nn==='zh' ? `${h.b}${so(cot(c1))}` : `${h.b} ${so(cot(c1))}`;
  } else {
    const tien = do_ ? (r1<r0) : (r1>r0);       // Do tien la hang giam
    const cheo = 'HEA'.includes(loai);
    const n0 = so(cheo ? cot(c1) : Math.abs(r1-r0));
    dong = (tien?h.t:h.th) + (nn==='zh' ? n0 : ' ' + n0);
  }
  return nn==='zh' ? `${ten}${so(cot(c0))}${dong}`
                   : `${ten} ${cot(c0)} ${dong}`;
}

// --- Am thanh: tep da cat khoang lang, phat NGAY khi quan bat dau truot ---
const TEP={}; const AM={di:.75,an:.95,het:.5,win:.6,thua:.6,hoa:.6,batdau:.5};
// Am thanh da chon va cat san tu tep goc nguoi dung cung cap.
// Ghi thang vao day thay vi de trong localStorage, de moi may va moi dia chi
// deu nghe giong nhau, va ai tai du an ve cung co san.
// Them ?v= de trinh duyet TAI LAI khi tep doi. Khong co no thi trinh duyet
// dung ban da luu dem theo TEN TEP, va noi dung moi khong bao gio den duoc -
// dung loi da gap: doi tep am thanh roi ma van nghe tieng cu.
const V = '3';
const MAC_DINH={di:'sound-move.wav',     an:'sound-capture.wav',
                batdau:'sound-start.wav', win:'sound-win.wav',
                thua:'sound-lose.wav',   hoa:'sound-start.wav',
                het:'sound-win.wav'};
// Xoa lua chon cu neu con: no tro toi cac tep am1..am10 da bi xoa sau khi
// gan co dinh, va se lam mat het am thanh.
localStorage.removeItem('am_gan');
for(const [k,f] of Object.entries(MAC_DINH)){
  const a=new Audio(f+'?v='+V); a.preload='auto'; a.load(); TEP[k]=a;
}
function amThanh(k){ try{ const a=TEP[k].cloneNode(); a.volume=AM[k]??.7;
  a.play().catch(()=>{}); }catch(e){} }

// --- Ngon ngu ---
function datNN(m){
  nn=m; T=NGON_NGU[m];
  document.documentElement.lang=m;
  ['vi','en','zh'].forEach(x=>document.getElementById('nn'+x)
    .classList.toggle('on', x===m));
  document.getElementById('tTieuDe').textContent=T.tieu_de;
  document.getElementById('tPhu').textContent=T.phu;
  document.getElementById('tNuocTot').textContent=T.nuoc_tot;
  document.getElementById('tVuaDi').textContent=T.nuoc_vua_di;
  document.getElementById('tNuocDaDi').textContent=T.nuoc_da_di;
  document.getElementById('tBiAn').textContent=T.bi_an;
  document.getElementById('nhanSach').textContent=T.theo_sach;
  document.getElementById('bLui').textContent='↰ '+T.lui;
  document.getElementById('bMoi').textContent=T.van_moi;
  document.getElementById('bXoay').textContent='⇅ '+T.xoay;
  document.getElementById('bGoiY').textContent='💡 '+T.goi_y;
  document.getElementById('bFen').textContent=T.nap_fen;
  const dat=(id,ds)=>{const e=document.getElementById(id), g=e.value;
    e.innerHTML=ds.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
    if(g) e.value=g;};
  dat('cheDo',[['may',T.choi_may],['tu',T.tu_choi]]);
  dat('mucDo',[['de',T.de],['vua',T.vua],['kho',T.kho]]);
  document.getElementById('mucDo').title = T.giai_thich_muc;
  dat('benCam',[['trang',T.ben_cam+': '+T.do],['den',T.ben_cam+': '+T.den]]);
  localStorage.setItem('nn',m);
  veLuat();
  if(banCo) veLai();
}

function veLuat(){
  const thu = ['K','A','E','H','R','C','P'];
  document.getElementById('tCachDi').textContent = T.cach_di;
  document.getElementById('tLuatDacBiet').textContent = T.luat_dac_biet;
  document.getElementById('tGhiChu').textContent =
    nn==='vi' ? 'Ký hiệu dùng khi ghi nước đi — bên Đỏ trước, bên Đen sau.'
  : nn==='en' ? 'Notation used when recording moves — Red first, Black second.'
              : '记录着法时使用的记号 — 先红方，后黑方。';
  document.getElementById('bangQuan').innerHTML = thu.map(k=>`
    <div class="dong-quan">
      <div class="bieu d">${TEN[k][1]}</div>
      <div class="bieu n">${TEN[k][0]}</div>
      <div class="mo-ta"><b>${TEN_DAY[nn][k]}</b>
        <span class="kh">
          ${T.ky_hieu}: <code>${TEN[k][1]}</code> <code>${TEN[k][0]}</code>
          &nbsp;·&nbsp; ${T.ghi_nuoc}:
          <code>${TEN_QUAN_DO[nn][k]}</code> <code>${TEN_QUAN[nn][k]}</code>
        </span>
        <span>${T['q_'+k]}</span></div>
    </div>`).join('');
  document.getElementById('dsLuat').innerHTML =
    ['l1','l2','l3','l4','l5'].map((k,i)=>
      `<div class="y"><b>${i+1}.</b> ${T[k]}</div>`).join('');
}

function veBan(){
  const w=LE*2+O*8, h=LE*2+O*9+18;   // chua cho so cot o duoi
  let s=`<svg width="${w}" height="${h}">`;
  for(let r=0;r<10;r++) s+=`<line x1="${LE}" y1="${LE+r*O}" x2="${LE+8*O}"
    y2="${LE+r*O}" stroke="var(--luoi)" stroke-width="1.4"/>`;
  for(let c=0;c<9;c++){
    if(c===0||c===8) s+=`<line x1="${LE+c*O}" y1="${LE}" x2="${LE+c*O}"
      y2="${LE+9*O}" stroke="var(--luoi)" stroke-width="1.4"/>`;
    else{ s+=`<line x1="${LE+c*O}" y1="${LE}" x2="${LE+c*O}" y2="${LE+4*O}"
      stroke="var(--luoi)" stroke-width="1.4"/><line x1="${LE+c*O}"
      y1="${LE+5*O}" x2="${LE+c*O}" y2="${LE+9*O}" stroke="var(--luoi)"
      stroke-width="1.4"/>`; }
  }
  const ch=(a,b)=>`<line x1="${LE+3*O}" y1="${LE+a*O}" x2="${LE+5*O}"
    y2="${LE+b*O}" stroke="var(--luoi)" stroke-width="1.4"/>`;
  s+=ch(0,2)+ch(2,0)+ch(7,9)+ch(9,7);
  // So toa do: cot 1-9 o duoi, hang 1-10 ben trai (goc nhin nguoi choi)
  for(let c=0;c<9;c++){
    const nhan = xoay ? 9-c : c+1;
    s+=`<text x="${LE+c*O}" y="${LE+9*O+26}" fill="var(--luoi)" font-size="13"
        text-anchor="middle" opacity=".85">${nhan}</text>`;
  }
  for(let r=0;r<10;r++){
    const nhan = xoay ? r+1 : 10-r;
    s+=`<text x="${LE-16}" y="${LE+r*O+5}" fill="var(--luoi)" font-size="12"
        text-anchor="middle" opacity=".7">${nhan}</text>`;
  }
  s+=`<text x="${LE+1.9*O}" y="${LE+4.62*O}" fill="var(--luoi)" font-size="21"
      font-family="serif" opacity=".75">楚河</text>
      <text x="${LE+5.3*O}" y="${LE+4.62*O}" fill="var(--luoi)" font-size="21"
      font-family="serif" opacity=".75">漢界</text></svg>`;
  const b=document.getElementById('ban'); b.innerHTML=s;
  const lop=document.createElement('div'); lop.className='lop-bam';
  lop.onclick=e=>{ const h=b.getBoundingClientRect();
    const c=Math.round((e.clientX-h.left-LE)/O), r=Math.round((e.clientY-h.top-LE)/O);
    if(r<0||r>9||c<0||c>8) return; const [br,bc]=tuMH(r,c); bam(br,bc); };
  b.appendChild(lop);
}

function ve(){
  const b=document.getElementById('ban');
  b.querySelectorAll('.quan,.cham').forEach(e=>e.remove());
  if(!banCo) return;
  const kt=O*.82;
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){
    const p=banCo[r][c]; if(p==='.') continue;
    const hoa=p===p.toUpperCase();
    const d=document.createElement('div');
    d.className='quan '+(hoa?'do':'den');
    const [mr,mc]=raMH(r,c);
    d.style.cssText=`width:${kt}px;height:${kt}px;left:${LE+mc*O-kt/2}px;
      top:${LE+mr*O-kt/2}px;font-size:${kt*.55}px`;
    d.textContent=TEN[p.toUpperCase()][hoa?1:0];
    if(chon&&chon[0]===r&&chon[1]===c) d.classList.add('chon');
    if(vuaDi&&((vuaDi[0]===r&&vuaDi[1]===c)||(vuaDi[2]===r&&vuaDi[3]===c)))
      d.classList.add('vua-di');
    if(chon&&hopLe.some(m=>m[0]===chon[0]&&m[1]===chon[1]&&m[2]===r&&m[3]===c))
      d.classList.add('se-bi-an');
    d.onclick=()=>bam(r,c);
    b.appendChild(d);
  }
  if(chon) hopLe.filter(m=>m[0]===chon[0]&&m[1]===chon[1]).forEach(m=>{
    const an=banCo[m[2]][m[3]]!=='.', k=an?kt:14;
    const d=document.createElement('div'); d.className='cham'+(an?' an':'');
    const [mr,mc]=raMH(m[2],m[3]);
    d.style.cssText=`width:${k}px;height:${k}px;left:${LE+mc*O-k/2}px;
      top:${LE+mr*O-k/2}px`;
    b.appendChild(d);
  });
}

function veMuiTen(){
  const b=document.getElementById('ban');
  b.querySelectorAll('.mui-ten').forEach(e=>e.remove());
  if(!goiY) return;
  const [a0,b0]=raMH(goiY[0],goiY[1]), [a1,b1]=raMH(goiY[2],goiY[3]);
  const x1=LE+b0*O, y1=LE+a0*O, x2=LE+b1*O, y2=LE+a1*O;
  const dx=x2-x1, dy=y2-y1, d=Math.hypot(dx,dy)||1, lui=O*.34;
  const ex=x2-dx/d*lui, ey=y2-dy/d*lui;
  const mau=benDi==='trang'?'#e74c3c':'#4a9eff';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','mui-ten');
  svg.setAttribute('width',LE*2+O*8); svg.setAttribute('height',LE*2+O*9+18);
  svg.innerHTML=`<defs><marker id="dau" markerWidth="4" markerHeight="4"
    refX="2.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="${mau}"/>
    </marker></defs><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}"
    stroke="${mau}" stroke-width="7" stroke-linecap="round"
    marker-end="url(#dau)" opacity=".75"/>`;
  b.appendChild(svg);
}

function veLai(){ ve(); veMuiTen(); }
function xoayBan(){ xoay=!xoay; veBan(); veLai(); }

function bay(mv, xong){
  const b=document.getElementById('ban'), kt=O*.82;
  const [sr,sc]=raMH(mv[0],mv[1]), [dr,dc]=raMH(mv[2],mv[3]);
  const q=[...b.querySelectorAll('.quan')].find(e=>
    Math.abs(parseFloat(e.style.left)-(LE+sc*O-kt/2))<2 &&
    Math.abs(parseFloat(e.style.top)-(LE+sr*O-kt/2))<2);
  if(!q){ xong(); return; }
  amThanh(banCo[mv[2]][mv[3]]!=='.'?'an':'di');
  q.classList.add('bay');
  requestAnimationFrame(()=>{ q.style.left=(LE+dc*O-kt/2)+'px';
                              q.style.top=(LE+dr*O-kt/2)+'px'; });
  setTimeout(xong,265);
}

function bam(r,c){
  if(!van) return;
  if(dangCho&&!tuChoi()) return;
  if(chon){
    const mv=hopLe.find(m=>m[0]===chon[0]&&m[1]===chon[1]&&m[2]===r&&m[3]===c);
    if(mv){ chon=null; di(mv); return; }
  }
  const p=banCo[r][c];
  const minh=document.getElementById('benCam').value;
  const cuaMinh = minh==='trang' ? p===p.toUpperCase() : p===p.toLowerCase();
  chon = (p!=='.'&&hopLe.some(m=>m[0]===r&&m[1]===c)&&(tuChoi()||cuaMinh))?[r,c]:null;
  ve();
}

function thanh(d){
  document.getElementById('thanhDo').style.height=Math.max(0,Math.min(100,d/10))+'%';
  document.getElementById('soDo').textContent=d;
  document.getElementById('soDen').textContent=1000-d;
  document.getElementById('diemTo').textContent=d;
  const n=document.getElementById('nhanDiem');
  if(d>=990){ n.textContent=T.do_thang; n.style.background='#c0392b'; }
  else if(d<=10){ n.textContent=T.den_thang; n.style.background='#1c1c1c'; }
  else if(d>545){ n.textContent=T.do_loi; n.style.background='#8b3a2f'; }
  else if(d<455){ n.textContent=T.den_loi; n.style.background='#2c3e50'; }
  else{ n.textContent=T.can_bang; n.style.background='#3a3f49'; }
}

function chamNuoc(truoc,sau,ben){
  const l = ben==='trang' ? sau-truoc : truoc-sau;
  if(l>=-12) return{t:T.tot,m:'#2ecc71',l};
  if(l>=-40) return{t:T.khong_chuan,m:'#f1c40f',l};
  if(l>=-110) return{t:T.sai_lam,m:'#e67e22',l};
  return{t:T.sai_nghiem,m:'#e74c3c',l};
}

function capNhat(d){
  banCo=d.ban_co.map(h=>h.split('')); hopLe=d.nuoc_hop_le||[]; benDi=d.ben_di;
  if(d.fen) document.getElementById('oFen').value=d.fen;
  if(d.diem!==undefined) thanh(d.diem);
  const t=document.getElementById('ttVan'), minh=document.getElementById('benCam').value;
  if(d.trang_thai!=='dang_choi'){
    const ai={trang_thang:'trang',den_thang:'den'}[d.trang_thai];
    t.innerHTML=`<b>${d.trang_thai==='hoa'?T.hoa:(tuChoi()
      ? (ai==='trang'?T.do_thang:T.den_thang)
      : (ai===minh?T.ban_thang:T.may_thang))}</b> <span style="color:var(--mo)">${d.ly_do||''}</span>`;
    const minh2=document.getElementById('benCam').value;
    const ai2={trang_thang:'trang',den_thang:'den'}[d.trang_thai];
    amThanh(d.trang_thai==='hoa' ? (TEP.hoa?'hoa':'het')
            : (tuChoi()||ai2===minh2 ? (TEP.win?'win':'het')
                                     : (TEP.thua?'thua':'het')));
  }else{
    t.innerHTML = tuChoi()
      ? `${T.luot_cua} <b>${d.ben_di==='trang'?'Đỏ':'Đen'}</b>`
      : (d.ben_di===minh?T.den_luot:T.may_nghi);
    // Khong co am rieng cho chieu tuong: no xay ra lien tuc trong van, va
    // thanh trang thai da bao bang chu do roi.
    if(d.bi_chieu) t.innerHTML+=` — <b style="color:#e74c3c">${T.bi_chieu}</b>`;
  }
  veLai();
}

function hienPhanTich(p){
  if(p.nuoc_tot){
    document.getElementById('benTot').textContent=p.ben_di==='trang'?'Đỏ':'Đen';
    document.getElementById('nuocTot').textContent=kyHieu(p.nuoc_tot);
    const bc=(p.bien_chinh||[]).map(kyHieu).join(' ');
    document.getElementById('pv').innerHTML = bc
      ? `${T.bien_chinh}: <b>${bc}</b><br>${T.neu_di} ${kyHieu(p.nuoc_tot)} → ${T.diem_thanh} ${p.diem}`
      : '';
    goiY=p.nuoc_tot; veMuiTen();
  }
  document.getElementById('nhanSach').style.display = p.trong_sach?'inline-block':'none';
  const k=document.getElementById('bangKy');
  k.innerHTML=`
    <span>${T.luong_gia}</span><span>NNUE + ${T.tinh}</span>
    <span>${T.tinh}</span><span>${p.diem_tinh??'—'}</span>
    <span>${T.sau}</span><span>${p.diem??'—'}</span>
    <span>${T.do_sau}</span><span>${p.do_sau??'—'}</span>
    <span>${T.so_nut}</span><span>${(p.so_nut||0).toLocaleString()}</span>
    <span>${T.thoi_gian}</span><span>${p.giay??'—'}s (${((p.nut_moi_giay||0)/1000).toFixed(0)}k ${T.nut_giay})</span>`;
}

const goi=async(d,b)=>(await fetch(d,{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})).json();

async function phanTich(){
  const p=++phien;
  const d=await goi('/api/phan-tich',{ma_van:van,
    muc_do:document.getElementById('mucDo').value});
  if(p!==phien) return;
  if(d.diem!==undefined){ thanh(d.diem); diemTruoc=d.diem; }
  hienPhanTich(d);
}
const neuTuChoi=()=>{ if(tuChoi()&&van) phanTich(); };
function doiCheDo(){ goiY=null; veMuiTen(); neuTuChoi(); }

async function vanMoi(){
  const ben=document.getElementById('benCam').value;
  xoay=(ben==='den');
  const d=await goi('/api/van-moi',{nguoi_cam:ben,
    muc_do:document.getElementById('mucDo').value});
  van=d.ma_van; chon=null; goiY=null; lichSu=[]; quanBiAn=[]; banTruocNuoc=[]; phien++;
  veBiAn();
  vuaDi=d.nuoc_may||null; diemTruoc=505;
  if(d.nuoc_may) lichSu.push(d.nuoc_may);
  document.getElementById('ds').innerHTML='';
  document.getElementById('nuocTot').textContent='—';
  document.getElementById('pv').innerHTML='';
  document.getElementById('chamNuoc').textContent='';
  capNhat(d); veDs(); amThanh('batdau');
  if(tuChoi()) phanTich();
}

async function di(mv){
  dangCho=true; const benTruoc=benDi;
  const anDuoc=banCo[mv[2]][mv[3]];
  if(anDuoc!=='.') { quanBiAn.push(anDuoc); veBiAn(); }
  goiY=null; phien++; chon=null;
  banTruocNuoc.push(banCo.map(h=>h.slice()));
  await new Promise(r=>bay(mv,r));
  vuaDi=mv; lichSu.push(mv);
  document.getElementById('vuaDiTxt').textContent=
    ghiNuoc(mv, banTruocNuoc[banTruocNuoc.length-1]);
  document.getElementById('ttVan').textContent = tuChoi()?T.dang_phan_tich:T.may_nghi;
  const d=await goi('/api/di',{ma_van:van,nuoc:mv,tu_choi:tuChoi(),
    muc_do:document.getElementById('mucDo').value});
  dangCho=false;
  if(d.loi){ document.getElementById('ttVan').textContent='⚠ '+d.loi; return; }
  const dc=d.diem_nuoc_nguoi??d.diem;
  if(dc!==undefined){
    const c=chamNuoc(diemTruoc,dc,benTruoc);
    document.getElementById('chamNuoc').innerHTML=
      ` · <b style="color:${c.m}">${c.t}</b> <span style="color:var(--mo)">${c.l>=0?'+':''}${c.l}</span>`;
  }
  if(d.nuoc_may){
    const [rr,cc]=[d.nuoc_may[2],d.nuoc_may[3]];
    if(banCo[rr][cc]!=='.'){ quanBiAn.push(banCo[rr][cc]); veBiAn(); }
    banTruocNuoc.push(banCo.map(h=>h.slice()));
    banCo=d.ban_co.map(h=>h.split(''));
    const [r0,c0,r1,c1]=d.nuoc_may;
    banCo[r0][c0]=banCo[r1][c1]; banCo[r1][c1]='.';
    hopLe=[]; chon=null; ve();
    await new Promise(r=>bay(d.nuoc_may,r));
    vuaDi=d.nuoc_may; lichSu.push(d.nuoc_may);
    document.getElementById('vuaDiTxt').textContent=kyHieu(d.nuoc_may);
  }
  diemTruoc=d.diem; capNhat(d); veDs();
  if(tuChoi()&&d.trang_thai==='dang_choi') phanTich();
}

// Chi VE MUI TEN goi y, khong tu di - nguoi choi tu quyet dinh co theo hay khong
async function xinGoiY(){
  if(!van||dangCho) return;
  const p=++phien;
  document.getElementById('nuocTot').textContent='…';
  const d=await goi('/api/goi-y',{ma_van:van,
    muc_do:document.getElementById('mucDo').value});
  if(p!==phien) return;
  if(d.nuoc){ goiY=d.nuoc; veMuiTen();
    document.getElementById('benTot').textContent=d.ben==='trang'?'Đỏ':'Đen';
    document.getElementById('nuocTot').textContent=
      ghiNuoc(d.nuoc, banCo); }
  if(d.diem!==undefined) thanh(d.diem);
}

async function lui(){
  if(!van||dangCho) return;
  const bo = 1;      // luon lui MOT nuoc, bam nhieu lan de lui tiep
  const d=await goi('/api/lui',{ma_van:van,so_nuoc:bo,cac_nuoc:lichSu});
  lichSu=lichSu.slice(0,Math.max(0,lichSu.length-bo));
  vuaDi=lichSu.length?lichSu[lichSu.length-1]:null;
  goiY=null; phien++; chon=null;
  document.getElementById('vuaDiTxt').textContent=kyHieu(vuaDi);
  document.getElementById('chamNuoc').textContent='';
  capNhat(d); veDs();
  if(tuChoi()) phanTich();
}

async function napFen(){
  const f=document.getElementById('oFen').value.trim();
  if(!f) return;
  const d=await goi('/api/nap-fen',{fen:f});
  if(d.loi){ document.getElementById('ttVan').textContent='⚠ '+d.loi; return; }
  van=d.ma_van; chon=null; goiY=null; lichSu=[]; vuaDi=null; phien++;
  document.getElementById('ds').innerHTML='';
  capNhat(d);
  if(tuChoi()) phanTich();
}

function veBiAn(){
  const e=document.getElementById('biAn');
  if(!quanBiAn.length){ e.textContent='—'; return; }
  // Quan Do va quan Den tach hai hang cho de nhin ai mat gi
  const nhom=q=>quanBiAn.filter(p=>q?p===p.toUpperCase():p===p.toLowerCase())
    .map(p=>`<span style="color:${q?'#e74c3c':'#cfd3da'}">${
      TEN[p.toUpperCase()][q?1:0]}</span>`).join(' ');
  const d=nhom(true), n=nhom(false);
  e.innerHTML=(d?`<div>${d}</div>`:'')+(n?`<div>${n}</div>`:'');
}

function veDs(){
  const ds=document.getElementById('ds'); ds.innerHTML='';
  for(let i=0;i<lichSu.length;i+=2){
    const d=document.createElement('div');
    const g=(k)=>lichSu[k]?ghiNuoc(lichSu[k], banTruocNuoc[k]):'';
    d.innerHTML=`<span>${i/2+1}.</span>
      <span style="color:#ff6b5a;font-weight:600">${g(i)}</span>
      <span style="color:#dfe3ea">${g(i+1)}</span>`;
    ds.appendChild(d);
  }
  ds.scrollTop=ds.scrollHeight;
}

fetch('/api/dia-chi',{method:'POST',body:'{}',
  headers:{'Content-Type':'application/json'}}).then(r=>r.json()).then(d=>{
    if(d.lan) document.getElementById('chiaSe').textContent=T.chia_se+': '+d.lan;
  }).catch(()=>{});

datNN(localStorage.getItem('nn')||'vi');
veBan();
vanMoi();
</script>
